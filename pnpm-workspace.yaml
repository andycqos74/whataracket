packages:
  - "packages/*"
  - "apps/*"
  - "tools/*"

# Security floors for transitive dependencies a direct dependency pins below
# a patched release. Each line names the advisory it closes; remove it once
# the parent package ships the fix itself.
overrides:
  # HIGH: getAuthContext can return unverified peer identity (fixed in 1.14.5).
  "@grpc/grpc-js": "^1.14.5"

